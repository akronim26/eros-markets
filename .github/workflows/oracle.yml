name: oracle

on:
  push:
    paths: ["oracle/**", "contracts/src/**", "contracts/test/mocks/**", ".github/workflows/oracle.yml"]
  pull_request:
    paths: ["oracle/**", "contracts/src/**", "contracts/test/mocks/**", ".github/workflows/oracle.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oracle
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - name: Build and contract sizes
        run: forge build --sizes
      - name: Test (unit, fuzz, invariant, real UMA, seam, vectors)
        run: forge test -vvv
      # The local-deploy suites (keeper O31.4, panel runner O33.5) run locally: bun run test:fork in each service.

      - name: Real factory, oracle, risk and book on Monad
        env:
          FOUNDRY_PROFILE: integration
        # The 1,024-owner fixture aggregates thousands of independent setup/claim
        # calls in one test. Accepted rollover batches still assert the padded 30M cap.
        run: forge test --match-path 'test/integration/*.t.sol' --network monad --hardfork monad:MonadTen --isolate --gas-limit 10000000000 -vv

  packages:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oracle
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # oracle-cli's tests dry-run createMarket with `forge script` (O22.2); claims render through oracle-sdk (O30.3)
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install (workspace lockfile)
        run: bun install --frozen-lockfile
      # Deployment preflight tests verify current bytecode and source metadata.
      # Jobs have separate filesystems; the forge job's artifacts are not available here.
      - name: Build artifacts for deployment preflight tests
        env:
          FOUNDRY_PROFILE: integration
        run: forge build --skip test --skip script
      # Each workspace member's own `test` script: a bare `bun test` here would also pick up the test files of
      # the vendored libraries under lib/ (ADJ-11).
      - name: Test (packages and services)
        run: bun run --filter '*' test
      - name: Typecheck integration services
        run: |
          bun run --cwd services/keeper typecheck
          bun run --cwd services/market-ops typecheck

      # These projects have independent lockfiles; share setup, not dependency installs.
      - name: CRE resolution workflow
        working-directory: oracle/workflows/resolution
        run: |
          bun install --frozen-lockfile
          bun test
          bun run typecheck
          bun run build
      - name: CRE dry-run workflow
        working-directory: oracle/workflows/dryrun
        run: |
          bun install --frozen-lockfile
          bun test
          bun run typecheck
          bun run build
      - name: No withDefault on either outcome path
        run: |
          for path in workflows/resolution workflows/dryrun packages; do
            test -d "$path"
          done
          status=0
          grep -rnF --exclude-dir=node_modules --include='*.ts' '.withDefault(' workflows/resolution workflows/dryrun packages || status=$?
          test "$status" -eq 1

  indexer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oracle/indexer
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen
      - run: pnpm typecheck
      # handler tests replay the recorded local-deploy events (scripts/record.test.ts, run locally with anvil)
      - run: pnpm test

  validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oracle/validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The dataset itself is local only (ADJ-39): here the fixture and pin tests run and the dataset tests skip.
      - run: python3 -m unittest discover -s tests -t .
