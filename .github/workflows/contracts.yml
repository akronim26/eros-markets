name: contracts

on:
  push:
    paths: ["contracts/**", ".github/workflows/contracts.yml"]
  pull_request:
    paths: ["contracts/**", ".github/workflows/contracts.yml"]

permissions:
  contents: read

jobs:
  forge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3

      - name: Format
        run: forge fmt --check

      - name: Build and contract sizes
        run: forge build --sizes

      - name: Test (unit, fuzz, invariant, differential)
        run: forge test -vvv

      - name: Gas snapshot unchanged
        run: FORGE_SNAPSHOT_CHECK=true forge test --mc BookGasTest
