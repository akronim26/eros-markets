name: frontend

on:
  push:
    paths: ["packages/pricefeed/src/read-pool.ts", "frontend/**", "packages/risk-sdk/**", "oracle/packages/oracle-sdk/**", "services/automation/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["packages/pricefeed/src/read-pool.ts", "frontend/**", "packages/risk-sdk/**", "oracle/packages/oracle-sdk/**", "services/automation/**", ".github/workflows/frontend.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Server and read recovery tests
        run: npm run test:integration
      # Next.js checks application and generated-route TypeScript during this build.
      - name: Production build and typecheck
        run: npm run build -- --webpack
