name: frontend

on:
  push:
    paths: ["frontend/**", "packages/risk-sdk/**", "services/automation/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", "packages/risk-sdk/**", "services/automation/**", ".github/workflows/frontend.yml"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Reject high and critical dependency advisories
        run: npm audit --audit-level=high
      - name: Unit tests
        run: npm test
      - name: Server and read recovery tests
        run: npm run test:integration
      - name: Production build
        run: npm run build -- --webpack
      - name: Typecheck generated routes and source
        run: npm run typecheck
