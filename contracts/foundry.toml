[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
remappings = ["solady/=lib/solady/src/"]

[fuzz]
runs = 1000

[invariant]
runs = 48
depth = 64
fail_on_revert = true

[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 256
depth = 128

[fmt]
line_length = 110
