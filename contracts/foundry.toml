[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
remappings = ["solady/=lib/solady/src/"]

[fuzz]
runs = 1000

[invariant]
runs = 48
depth = 64
fail_on_revert = true

[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 256
depth = 128

# A002: isolate reproducible risk checks from the existing Book test profiles.
# solc and dependencies stay pinned above / by the repository's Git submodules.
[profile.risk]
# The test-only A harness exposes every internal port in one deployment. Final
# A+B composition and chain code-size limits are separate merge/release checks.
code_size_limit = 65536

[profile.risk.fuzz]
runs = 1000
seed = "0x45524f53"

[profile.risk.invariant]
runs = 48
depth = 64
fail_on_revert = true

[fmt]
line_length = 110
# Deterministic machine-generated arrays retain the reference exporter's layout.
ignore = ["test/math/A/ReferenceVectors.sol", "test/invariant/A/IntegratedVectors.sol"]
