# Current verified frontend deployment; generated pins: node scripts/current-config.mjs --write
name: eros-current-testnet
description: Eros Markets resolution oracle (Layers 1-3) on Monad testnet
field_selection:
  transaction_fields:
    - hash
    - from
contracts:
  - name: ResolutionOracle
    abi_file_path: ../abi/ResolutionOracle.json
    events:
      - event: ResolutionInitialized
      - event: HaltRecorded
      - event: StateChanged
      - event: ResolutionRequested
      - event: ProposedL1
      - event: ProposalRecorded
      - event: PanelResultAccepted
      - event: PanelNotYet
      - event: Asserted
      - event: Disputed
      - event: AssertionRejected
      - event: Finalized
      - event: Voided
      - event: TrustSetCreated
      - event: TrustSetActivated
      - event: TrustSetRevoked
      - event: WatchdogHeartbeat
  - name: MarketRegistry
    abi_file_path: ../abi/MarketRegistry.json
    events:
      - event: MarketListed
      - event: CategorySet
      - event: FactorySet
  - name: BondTreasury
    abi_file_path: ../abi/BondTreasury.json
    events:
      - event: Deposited
      - event: Withdrawn
      - event: ListingCommitted
      - event: ListingReleased
      - event: AssertionFunded
      - event: BondReturned
      - event: BondLost
      - event: BondStuck
      - event: DisputeFunded
      - event: DisputeClosed
      - event: RewardOwed
      - event: RewardPaid
      - event: OwedClaimed
      - event: Skimmed
  - name: UmaAdapter
    abi_file_path: ../abi/UmaAdapter.json
    events:
      - event: VenueAsserted
      - event: VenueDisputed
      - event: VenueResolved
  - name: OptimisticOracleV3
    events:
      - event: AssertionMade(bytes32 indexed assertionId, bytes32 domainId, bytes claim,
          address indexed asserter, address callbackRecipient, address
          escalationManager, address caller, uint64 expirationTime, address
          currency, uint256 bond, bytes32 indexed identifier)
      - event: AssertionDisputed(bytes32 indexed assertionId, address indexed caller,
          address indexed disputer)
      - event: AssertionSettled(bytes32 indexed assertionId, address indexed
          bondRecipient, bool disputed, bool settlementResolution, address
          settleCaller)
  - name: KeystoneForwarder
    events:
      - event: ReportProcessed(address indexed receiver, bytes32 indexed
          workflowExecutionId, bytes2 indexed reportId, bool result)
  - name: ErosSandboxOracle
    abi_file_path: ../abi/ErosSandboxOracle.json
    events:
      - event: PriceRequested
      - event: PricePushed
  - name: TradingEngine
    abi_file_path: abis/TradingEngine.json
    events:
      - event: AccountRegistered
      - event: AccountSynced
      - event: AccountTakenOver
      - event: AllOrdersCancelled
      - event: CashAllocated
      - event: Fill
      - event: FloorOrdersInvalidated
      - event: LiquidationOutcome
      - event: ObservationAccepted
      - event: OrderCancelled
      - event: OrderPlaced
      - event: OrderRejected
      - event: OrdersInvalidated
      - event: PairReduction
      - event: PairedPosting
      - event: PerpObservationRecorded
  - name: TradingVault
    abi_file_path: abis/TradingVault.json
    events:
      - event: Allocation
      - event: Deposit
      - event: Escrowed
      - event: FeesPaid
      - event: FeesReclassified
      - event: KeeperFeeAssigned
      - event: Paid
      - event: Released
  - name: TradingFactory
    events:
      - event: MarketDeployed(bytes32 indexed marketId, address indexed engine, address
          indexed vault, bytes32 listingHash)
  - name: CollateralToken
    events:
      - event: Transfer(address indexed from, address indexed to, uint256 value)
