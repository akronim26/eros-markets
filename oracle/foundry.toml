[profile.default]
src = "src"
test = "test"
no_match_path = "test/integration/**"
script = "script"
out = "out"
libs = ["lib"]
auto_detect_solc = true          # legacy UMA requires its own exact 0.8.16 compiler
# A caret pragma otherwise selects newer installed compilers and changes deployed
# bytecode. Restrict every EROS source and its importers to the tested compiler.
compilation_restrictions = [{ paths = "src/**", version = "=0.8.30" }]
evm_version = "prague"
optimizer = true
optimizer_runs = 200
code_size_limit = 131072         # Monad 128 KiB, same as contracts/
bytecode_hash = "none"            # Monad explorer (Sourcify) verification; Monad docs call this metadata_hash
use_literal_content = true
allow_paths = ["../contracts"]
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./out" }, { access = "read", path = "./vectors" }, { access = "read-write", path = "./vectors/claim.json" }, { access = "read", path = "./listings" }]   # scripts write addresses here; tests read artifacts and vectors (ADJ-28), ClaimVectors regenerates claim.json (O30.3); ListMarket reads listing packs (ADJ-34)
remappings = [
  "solady/=lib/solady/src/",
  "forge-std/=lib/forge-std/src/",
  "@eros/=../contracts/src/",
  "@eros-test/=../contracts/test/",
  "@uma/=lib/uma-protocol/packages/",
  "@openzeppelin/=lib/openzeppelin-contracts-v4/",
]

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 64
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 256
depth = 128
fail_on_revert = false

[profile.integration]
test = "test/integration"
no_match_path = "test/uma/**"
script = "script/integration"
solc_version = "0.8.30"
auto_detect_solc = false
code_size_limit = 1000000

[profile.integration.fuzz]
runs = 1000
seed = "0x45524f53"
