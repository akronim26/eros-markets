# Review/create manually. Disable Blueprint Auto Sync in the dashboard separately.
# No code auto-deploys or preview replicas; start is read-only
# until an operator explicitly prepares a pinned profile on the persistent disk.
services:
  - type: worker
    name: eros-pricefeed-diagnostic
    runtime: node
    rootDir: packages/pricefeed
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && ./node_modules/.bin/node node_modules/typescript/bin/tsc -p tsconfig.json
    startCommand: ./node_modules/.bin/node dist/scripts/render-start.js
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: PRICEFEED_SERVICE_PROFILE
        value: /var/data/pricefeed/profile.json
      - key: PRICEFEED_OPERATIONS_CONFIG
        value: /var/data/pricefeed/operations.json
    disk:
      name: pricefeed-state
      mountPath: /var/data
      sizeGB: 1
