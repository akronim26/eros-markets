[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
solc_version = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
libs = ["../../../../contracts/lib"]
remappings = ["forge-std/=../../../../contracts/lib/forge-std/src/", "solady/=../../../../contracts/lib/solady/src/", "risk/=../../../../contracts/src/"]
allow_paths = ["../../../../contracts"]
fs_permissions = [{ access = "read", path = "../../fixtures/wire.json" }]

[fuzz]
runs = 100
